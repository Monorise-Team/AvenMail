# Lokalny serwer poczty do testów silnika (GreenMail): IMAP 3143 (bez TLS) i 3993 (TLS), SMTP 3025 i 3465.
# Każdy adres i hasło są akceptowane, konta zakładają się same. Uruchom: pnpm mail:test-server
services:
  greenmail:
    image: greenmail/standalone:2.1.5
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.verbose"
    ports:
      - "127.0.0.1:3025:3025"
      - "127.0.0.1:3143:3143"
      - "127.0.0.1:3465:3465"
      - "127.0.0.1:3993:3993"
