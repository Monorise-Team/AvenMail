[package]
name = "avenmail"
version = "0.0.0" # x-release-please-version
description = "AvenMail: klient poczty Monorise na komputer"
authors = ["Monorise"]
license = "LicenseRef-Proprietary"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "avenmail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
