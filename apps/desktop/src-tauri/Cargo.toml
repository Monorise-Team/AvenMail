[package]
name = "avenmail"
version = "0.0.0" # x-release-please-version
description = "AvenMail: klient poczty Monorise na komputer"
authors = ["Monorise"]
license = "LicenseRef-Proprietary"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "avenmail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Przeglądarka systemowa z ekranem logowania Core i zapytania do Core bez ograniczeń CORS okna
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
# Systemowy sejf na tokeny: Keychain (macOS), Credential Manager (Windows), Secret Service (Linux)
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
